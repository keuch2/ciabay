; Límites para la subida de maquetas HTML desde el admin (importador de
; páginas). Lo respetan PHP-FPM/FastCGI y LiteSpeed/LSAPI (hosting Ferozo);
; puede tardar hasta 5 minutos en aplicarse tras el deploy (user_ini.cache_ttl).
; `php artisan serve` NO lo lee — ver CLAUDE.md.
upload_max_filesize = 64M
post_max_size = 68M
max_execution_time = 120
memory_limit = 512M
